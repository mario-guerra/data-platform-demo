name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '11'
  PYTHON_VERSION: '3.10'
  SCALA_VERSION: '2.12.17'
  SBT_VERSION: '1.9.6'

jobs:
  lint-and-format:
    name: 'Lint and Format Check'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

    - name: Check Python formatting with black
      run: |
        black --check .

    - name: Run flake8 linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  test-python:
    name: 'Test Python Components'
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy scikit-learn
        pip install pyspark delta-spark mlflow

    - name: Run Python tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Test ML training script (dry run)
      run: |
        cd ml/training
        python -c "
        import train
        print('✓ ML training script imports successfully')
        "

    - name: Test ML serving handler
      run: |
        cd ml/serving
        python lambda_handler.py test

  build-java:
    name: 'Build Java Producer'
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: |
        cd ingestion/java-producer
        mvn clean compile

    - name: Run Maven tests
      run: |
        cd ingestion/java-producer
        mvn test

    - name: Package JAR
      run: |
        cd ingestion/java-producer
        mvn clean package

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: kafka-producer-jar
        path: ingestion/java-producer/target/*.jar

  build-scala:
    name: 'Build Scala ETL'
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Setup SBT
      uses: olafurpg/setup-scala@v14
      with:
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache SBT dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: ${{ runner.os }}-sbt-

    - name: Compile Scala code
      run: |
        cd spark/scala
        sbt clean compile

    - name: Run Scala tests
      run: |
        cd spark/scala
        sbt test

    - name: Build assembly JAR
      run: |
        cd spark/scala
        sbt assembly

    - name: Upload Scala assembly
      uses: actions/upload-artifact@v3
      with:
        name: scala-etl-assembly
        path: spark/scala/target/scala-2.12/*.jar

  validate-terraform:
    name: 'Validate Terraform'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.6.0'

    - name: Terraform Format Check
      run: |
        cd infra/azure/terraform
        terraform fmt -check=true -diff=true

    - name: Terraform Init
      run: |
        cd infra/azure/terraform
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd infra/azure/terraform
        terraform validate

  validate-docker:
    name: 'Validate Docker Compose'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Docker Compose
      run: |
        docker compose config --quiet

    - name: Test Docker Compose (minimal)
      run: |
        # Start only essential services for testing
        docker compose up -d postgres minio
        sleep 30
        
        # Basic health checks
        docker compose ps
        
        # Check if services are responding
        curl -f http://localhost:9001/minio/health/live || echo "MinIO not ready"
        
        # Cleanup
        docker compose down

  security-scan:
    name: 'Security Scanning'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD

  integration-test:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: [build-java, build-scala, test-python]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Java artifact
      uses: actions/download-artifact@v3
      with:
        name: kafka-producer-jar
        path: ingestion/java-producer/target/

    - name: Download Scala artifact  
      uses: actions/download-artifact@v3
      with:
        name: scala-etl-assembly
        path: spark/scala/target/scala-2.12/

    - name: Set up integration test environment
      run: |
        cp .env.example .env
        docker compose up -d kafka postgres minio
        sleep 60  # Wait for services to be ready

    - name: Run integration tests
      run: |
        # Test Kafka connectivity
        docker compose exec -T kafka kafka-topics.sh --list --bootstrap-server localhost:29092
        
        # Test MinIO connectivity
        curl -f http://localhost:9001/minio/health/live
        
        # Test PostgreSQL connectivity
        docker compose exec -T postgres psql -U dataplatform -d dataplatform -c "SELECT 1;"

    - name: Cleanup integration test
      if: always()
      run: |
        docker compose down
        docker system prune -f

  create-release:
    name: 'Create Release'
    runs-on: ubuntu-latest
    needs: [integration-test, validate-terraform, validate-docker, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate release notes
      id: release_notes
      run: |
        echo "# Data Platform Demo Release" > release_notes.md
        echo "" >> release_notes.md
        echo "## Components Built" >> release_notes.md
        echo "- ✅ Java Kafka Producer" >> release_notes.md
        echo "- ✅ Scala Batch ETL" >> release_notes.md
        echo "- ✅ Python Streaming Job" >> release_notes.md
        echo "- ✅ ML Training & Serving" >> release_notes.md
        echo "- ✅ Terraform Infrastructure" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Usage" >> release_notes.md
        echo "1. Run \`make up\` to start local services" >> release_notes.md
        echo "2. Run \`make kafka-producer\` to generate test data" >> release_notes.md
        echo "3. Use GitHub Actions to deploy to Azure" >> release_notes.md

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body_path: release_notes.md
        draft: false
        prerelease: false